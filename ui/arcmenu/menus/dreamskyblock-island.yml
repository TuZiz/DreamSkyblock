backend:
  members:
    x: -42.7
    y: -8.54
    width: 38.857
    height: 26.047
    tooltip:
    - 🤝 成员管理
    - 查看成员、邀请在线好友与退出团队
    - 共同主人拥有相同的管理权限
    - ''
    - ▸ 点击打开成员管理
    update: 20
    actions:
      all:
      - 'sound: UI_BUTTON_CLICK-1-1'
      - 'open: dreamskyblock:action {0} members'
  settings:
    x: 0.0
    y: -8.54
    width: 38.857
    height: 26.047
    tooltip:
    - ⚙️ 空岛设置
    - 管理世界规则与访客互动权限
    - ''
    - ▸ 点击打开空岛设置
    update: 20
    actions:
      all:
      - 'sound: UI_BUTTON_CLICK-1-1'
      - 'open: dreamskyblock:action {0} settings'
  upgrade:
    x: 42.7
    y: -8.54
    width: 38.857
    height: 26.047
    tooltip:
    - ✨ 空岛升级信息
    - ∟ 当前等级：%dreamskyblock_level%
    - ∟ 累计经验：%dreamskyblock_experience%
    - ∟ 下一级经验需求：%dreamskyblock_required_experience%
    - ∟ 最高建造边界：384 × 384
