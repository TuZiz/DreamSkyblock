# 空岛当前设施总价值决定等级；拆除设施可降级，已解锁的较大边界保留。
schema-version: 1
default-level: 1
progression:
  # 每一级的累计价值门槛；不是升级消耗。1 级为 0，其余严格递增，最高 9 级。
  thresholds:
    '1': 0
    '2': 100
    '3': 300
    '4': 600
    '5': 1000
    '6': 1500
    '7': 2100
    '8': 2800
    '9': 3600
border:
  # 各等级正方形边界的边长，单位为方块；9 级以上维持最后一档。
  # 必须包含 1-9 级，范围 16-384，按等级递增；升级不重新生成世界。
  sizes:
    '1': 48
    '2': 64
    '3': 96
    '4': 128
    '5': 160
    '6': 192
    '7': 256
    '8': 320
    '9': 384
