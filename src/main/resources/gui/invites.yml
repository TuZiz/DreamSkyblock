    material: "YELLOW_STAINED_GLASS_PANE"
    name: "<#FFD700>❖"
    lore: []

  entry:
    symbol: "e"
    material: "PLAYER_HEAD"
    name: "<gradient:#FF9A9E:#FECFEF><b>💌 来自 <inviter> 的星海邀约</b></gradient>"
    lore:
