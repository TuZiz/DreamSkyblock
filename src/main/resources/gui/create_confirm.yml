# ==========================================
# 空岛创建确认菜单配置
# Shape 每行 9 格，文本与动作可在此调整
# ==========================================
schema-version: 1
title: "<gradient:#00F2FE:#4FACFE:#FFD700><b>✦ 空岛 · 领地唤醒确认 ✦</b></gradient>"

Shape:
  - "+#######+"
  - "#   I   #"
  - "#       #"
  - "# Y   N #"
  - "+#######+"

components:
  border:
    symbol: "#"
    material: "CYAN_STAINED_GLASS_PANE"
    name: "<#00F2FE>✦"
    lore: []

  corner:
    symbol: "+"
    material: "YELLOW_STAINED_GLASS_PANE"
    name: "<#FFD700>❖"
    lore: []

  info:
    symbol: "I"
    material: "GRASS_BLOCK"
    name: "<gradient:#00FF87:#60EFFF><b>🌱 初始星域 · <template></b></gradient>"
    lore:
      - "<#FFD700>❖ 领地初始参数"
      - "<#2DD4BF>  ∟ 核心平台：<#00FF87><b><platform> × <platform></b>"
      - "<#2DD4BF>  ∟ 初始星级：<#FFD700><b><level> 级</b>"
      - "<#2DD4BF>  ∟ 建造边界：<#00F2FE><b><border> × <border></b>"
      - ""
      - "<#FBBF24>  ★ 每位开拓者仅可拥有或归属 1 座专属空岛"
      - "<#67E8F9>  ★ 确认唤醒后将立即开辟星域并传送登岛！"

  yes:
    symbol: "Y"
    material: "LIME_CONCRETE"
    name: "<gradient:#00FF87:#60EFFF><b>✔ 确认唤醒空岛</b></gradient>"
    lore:
      - "<#5EEAD4>  以当前初始领地开启你的星海生存之旅！"
      - ""
      - "<#FFD700>▸ <b>点击立即创建并传送登岛</b>"
    action: "create"

  no:
    symbol: "N"
    material: "RED_CONCRETE"
    name: "<gradient:#FF416C:#FF4B2B><b>✖ 暂缓开辟 · 返回</b></gradient>"
    lore:
      - "<#67E8F9>  返回空岛星海主界面，暂不生成世界"
      - ""
      - "<#FBBF24>▸ <b>点击取消并返回主菜单</b>"
    action: "menu:main"